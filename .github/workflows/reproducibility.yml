name: Reproducibility check

# Builds twice from clean on the same runner and compares digests.
#
# This exists because we cannot currently claim bit-reproducibility and should
# not pretend otherwise. Two local builds of the same commit produced an
# identical .node but a DIFFERENT libvips-cpp.so, and static inspection found
# no obvious cause: no host paths leak in (sharp-libvips builds at fixed
# container paths, /deps and /target), and no build timestamps are embedded.
# sharp-libvips also has no SOURCE_DATE_EPOCH handling, so whatever varies is
# somewhere in its ~40 vendored dependency builds.
#
# Until that is chased down, the property that actually ties released bytes to
# a commit is the signed build-provenance attestation the release workflow
# emits — not a rebuild. This job measures the gap rather than hiding it, and
# gives a concrete artifact to work from if someone takes it on.
#
# Deliberately does not run on push: it is two full libvips builds.

on:
  workflow_dispatch:
    inputs:
      strict:
        description: "Fail the job if the two builds differ"
        type: boolean
        default: false
  schedule:
    # Monthly, so drift toward (or away from) reproducibility gets noticed.
    - cron: "0 6 1 * *"

jobs:
  double-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - run: npm install

      - name: Build once
        run: npm run build

      - name: Snapshot first build
        run: |
          mkdir -p "$RUNNER_TEMP/first"
          cp out/linux-x64/* "$RUNNER_TEMP/first/"
          (cd out/linux-x64 && sha256sum *) | tee "$RUNNER_TEMP/first.sha256"

      - name: Build again from clean
        run: |
          npm run clean
          npm run build

      - name: Compare
        run: |
          (cd out/linux-x64 && sha256sum *) | tee "$RUNNER_TEMP/second.sha256"
          {
            echo "## Reproducibility check"
            echo
            echo '### First build'
            echo '```'; cat "$RUNNER_TEMP/first.sha256"; echo '```'
            echo '### Second build'
            echo '```'; cat "$RUNNER_TEMP/second.sha256"; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          if diff -q "$RUNNER_TEMP/first.sha256" "$RUNNER_TEMP/second.sha256" >/dev/null; then
            echo "**Verdict: reproducible** — both builds produced identical digests." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "**Verdict: NOT reproducible** — digests differ." >> "$GITHUB_STEP_SUMMARY"
          echo >> "$GITHUB_STEP_SUMMARY"
          echo "Differing files:" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          diff "$RUNNER_TEMP/first.sha256" "$RUNNER_TEMP/second.sha256" || true
          diff "$RUNNER_TEMP/first.sha256" "$RUNNER_TEMP/second.sha256" >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

          # A first lead for whoever chases this: which sections differ.
          for f in out/linux-x64/*; do
            n=$(basename "$f")
            cmp -s "$f" "$RUNNER_TEMP/first/$n" && continue
            echo "### Section sizes differ? $n" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            diff <(readelf -SW "$RUNNER_TEMP/first/$n") <(readelf -SW "$f") \
              >> "$GITHUB_STEP_SUMMARY" || echo "(identical section table — content differs within sections)" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          done

          if [ "${{ inputs.strict }}" = "true" ]; then exit 1; fi
          echo "Not failing the job: strict was not requested." >> "$GITHUB_STEP_SUMMARY"
