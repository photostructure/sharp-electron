name: Release

# Builds the patched binaries and publishes them as release assets.
#
# Releases are cut HERE, not from a workstation. PhotoStructure pins these
# assets by sha256 in src/desktop/sharp-patched.json and installs them into
# every Linux desktop build, so their provenance needs to be a publicly logged
# run rather than "whatever was in someone's out/ directory". Each asset also gets a signed build-provenance attestation
# (verify with: gh attestation verify <file> --repo photostructure/sharp-electron).
#
# Tag scheme is `-ps.N`, deliberately not upstream's `-electron.N`: this is a
# fork of janhapke/sharp-electron and keeps inheriting its tags on every fetch,
# so a colliding tag would silently attach our assets to upstream's commit.

on:
  push:
    tags:
      - "v*-ps.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to create and release (e.g. v0.35.3-ps.2)"
        required: true

# Default to read; the release job elevates itself below, so any job added
# later starts least-privileged rather than inheriting publish rights.
permissions:
  contents: read

# Repository-wide and deliberately non-cancelling: publishing must never be
# interrupted halfway, and two tag pushes must not race to create one release.
concurrency:
  group: ${{ github.repository }}-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release and upload assets
      id-token: write # OIDC identity for the attestation
      attestations: write # record the build-provenance attestation
    steps:
      # workflow_dispatch's ref is operator-controlled: GitHub's UI and CLI can
      # dispatch from any branch or tag, and `gh release create` would then tag
      # whatever got checked out. Validate before checkout or any repository
      # code runs. This guard only protects refs whose own copy of this file
      # contains it, which is why the branch allowlist is narrow.
      - name: Validate dispatch ref and tag
        if: github.event_name == 'workflow_dispatch'
        env:
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          TAG: ${{ inputs.tag }}
        run: |
          if [ "$REF_TYPE" != "branch" ] || [ "$REF_NAME" != "main" ]; then
            echo "::error::may only be dispatched from the main branch (got $REF_TYPE '$REF_NAME')"
            exit 1
          fi
          case "$TAG" in
            v*-ps.*) ;;
            *)
              echo "::error::tag must match 'v*-ps.*' so it cannot collide with upstream's -electron.N tags (got '$TAG')"
              exit 1
              ;;
          esac

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Publishing uses github.token via the gh CLI below, not a credential
          # left in .git/config where every later step — including the upstream
          # sharp/libvips code this repo compiles — could read it.
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      # No cache, by design: these bytes get pinned by digest downstream, so a
      # poisoned or stale npm cache would be laundered into a signed release.
      - run: npm install

      # fetch -> patch -> libvips -> sharp -> both gates -> emit.
      # The gates are not optional here: a release that fails the Electron
      # crash regression is exactly the artifact we must never publish.
      - name: Build and verify
        run: npm run build

      - name: Record digests
        id: digests
        run: |
          cd out/linux-x64
          sha256sum -- * | tee "$RUNNER_TEMP/SHA256SUMS"
          {
            echo 'table<<EOF'
            echo '| file | sha256 |'
            echo '| --- | --- |'
            sha256sum -- * | awk '{printf "| `%s` | `%s` |\n", $2, $1}'
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      # Independent check that the emitted addon really is patched, so a
      # silently-unpatched build cannot be published even if the gates pass.
      - name: Assert no bare glib imports
        run: |
          cd out/linux-x64
          if readelf --dyn-syms -W sharp-linux-x64-*.node | grep ' UND ' | grep -qE '\bg_[a-z]'; then
            echo "::error::addon still imports bare glib symbols — not a patched build"
            readelf --dyn-syms -W sharp-linux-x64-*.node | grep ' UND ' | grep -E '\bg_[a-z]'
            exit 1
          fi
          test "$(readelf --dyn-syms -W libvips-cpp.so.* | grep -cE ' (g_object_|g_type_|g_signal_)')" = 0 \
            || { echo "::error::libvips still exports glib symbols"; exit 1; }
          echo "ok: 0 bare glib imports, 0 glib exports"

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "out/linux-x64/*"

      - name: Compose release notes
        env:
          TABLE: ${{ steps.digests.outputs.table }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          SHA: ${{ github.sha }}
        run: |
          # Written via a file rather than inline `--notes`, so GitHub
          # expressions and shell heredocs never have to interleave.
          {
            echo "Patched \`sharp\` addon and \`libvips\` for **linux-x64**, built from the upstream commits pinned in [versions.env](versions.env)."
            echo
            echo "Their glib symbols are renamed to \`vips_g_*\`, so they cannot bind to the system glib that Electron's Linux binary links via \`DT_NEEDED\`. Without that, sharp's \`g_object_unref\` resolves into the system libgobject while libvips keeps using its own statically-linked copy, and the process SIGSEGVs on the first image decode ([electron/electron#46323](https://github.com/electron/electron/issues/46323))."
            echo
            echo "**Install:** copy both into a project's \`node_modules/@img/sharp-linux-x64/lib/\`, then delete its \`node_modules/@img/sharp-libvips-linux-x64/\`. Both \`.so\` files share a SONAME and the ELF loader dedupes by SONAME per process, so the stock one must go rather than merely be shadowed."
            echo
          } > "$RUNNER_TEMP/notes.md"
          printf '%s\n\n' "$TABLE" >> "$RUNNER_TEMP/notes.md"
          {
            echo "Built by [this workflow run](https://github.com/$REPO/actions/runs/$RUN_ID) from \`$SHA\`, with a signed build-provenance attestation:"
            echo
            echo '```'
            echo "gh attestation verify <file> --repo $REPO"
            echo '```'
            echo
            echo "That subcommand needs gh >= 2.49. With an older gh, read the attestation through the API instead:"
            echo
            echo '```'
            echo "gh api repos/$REPO/attestations/sha256:<digest> --jq '.attestations[0].bundle.dsseEnvelope.payload' | base64 -d | jq .subject"
            echo '```'
            echo
            echo "Both gates passed: sharp's own upstream test suite, and the Electron crash regression."
          } >> "$RUNNER_TEMP/notes.md"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
          EVENT: ${{ github.event_name }}
        run: |
          # On a tag push the tag already exists, so require it to still match
          # what we built. A dispatch is creating the tag and cannot verify one.
          verify=()
          if [ "$EVENT" = "push" ]; then
            verify=(--verify-tag)
          fi
          gh release create "$TAG" out/linux-x64/* "${verify[@]}" \
            --title "$TAG — patched sharp for Electron on linux-x64" \
            --notes-file "$RUNNER_TEMP/notes.md"
